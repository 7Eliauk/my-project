<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="warmBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffecb3;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="steam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    
    <filter id="shadow2">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#607d8b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#455a64;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景装饰 -->
  <circle cx="300" cy="250" r="210" fill="url(#warmBg2)" opacity="0.7"/>
  <circle cx="100" cy="400" r="90" fill="#ffe082" opacity="0.4"/>
  <circle cx="520" cy="120" r="70" fill="#ffcc80" opacity="0.4"/>
  
  <!-- 装饰叶子 -->
  <g transform="translate(50, 100)">
    <ellipse cx="0" cy="0" rx="12" ry="22" fill="#81c784" transform="rotate(-25)"/>
    <ellipse cx="12" cy="8" rx="10" ry="18" fill="#a5d6a7" transform="rotate(15)"/>
  </g>
  
  <g transform="translate(550, 280)">
    <ellipse cx="0" cy="0" rx="14" ry="24" fill="#66bb6a" transform="rotate(35)"/>
    <ellipse cx="-12" cy="10" rx="10" ry="18" fill="#81c784" transform="rotate(10)"/>
  </g>
  
  <!-- 厨师人物 -->
  <g transform="translate(300, 180)" filter="url(#shadow2)">
    <!-- 厨师帽 -->
    <g transform="translate(-50, -80)">
      <path d="M10,50 Q-10,20 20,5 Q50,-10 80,5 Q110,20 90,50" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
      <rect x="15" y="50" width="70" height="22" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
      <line x1="35" y1="50" x2="35" y2="30" stroke="#eeeeee" stroke-width="2"/>
      <line x1="50" y1="50" x2="50" y2="25" stroke="#eeeeee" stroke-width="2"/>
      <line x1="65" y1="50" x2="65" y2="30" stroke="#eeeeee" stroke-width="2"/>
    </g>
    
    <!-- 人物头部 -->
    <circle cx="0" cy="0" r="38" fill="#ffcc80"/>
    <!-- 眼睛 -->
    <ellipse cx="-12" cy="-5" rx="5" ry="6" fill="#5d4037"/>
    <ellipse cx="12" cy="-5" rx="5" ry="6" fill="#5d4037"/>
    <circle cx="-10" cy="-6" r="2" fill="#ffffff"/>
    <circle cx="14" cy="-6" r="2" fill="#ffffff"/>
    <!-- 微笑 -->
    <path d="M-12,12 Q0,22 12,12" stroke="#8d6e63" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- 腮红 -->
    <ellipse cx="-20" cy="8" rx="6" ry="4" fill="#ffab91" opacity="0.6"/>
    <ellipse cx="20" cy="8" rx="6" ry="4" fill="#ffab91" opacity="0.6"/>
    
    <!-- 身体/围裙 -->
    <g transform="translate(0, 38)">
      <!-- 衣服 -->
      <path d="M-40,0 L40,0 L50,120 L-50,120 Z" fill="#ff7043"/>
      <!-- 围裙 -->
      <path d="M-35,10 L35,10 L45,110 L-45,110 Z" fill="#26a69a"/>
      <!-- 围裙带子 -->
      <path d="M-35,10 Q-40,-15 -30,0" fill="none" stroke="#00897b" stroke-width="4"/>
      <path d="M35,10 Q40,-15 30,0" fill="none" stroke="#00897b" stroke-width="4"/>
      <!-- 围裙口袋 -->
      <rect x="-25" y="50" width="50" height="30" fill="#00897b" rx="5"/>
    </g>
    
    <!-- 左手拿青菜 -->
    <g transform="translate(-85, 100)">
      <rect x="35" y="20" width="30" height="12" fill="#ffcc80" transform="rotate(-30 35 20)"/>
      <circle cx="28" cy="28" r="12" fill="#ffcc80"/>
      <!-- 青菜 -->
      <g transform="translate(10, 5)">
        <ellipse cx="15" cy="10" rx="10" ry="15" fill="#66bb6a" transform="rotate(-25 15 10)"/>
        <ellipse cx="22" cy="8" rx="8" ry="12" fill="#81c784" transform="rotate(15 22 8)"/>
        <ellipse cx="8" cy="15" rx="7" ry="12" fill="#4caf50" transform="rotate(-40 8 15)"/>
        <path d="M15,20 L12,38 L18,38 L15,20" fill="#a5d6a7"/>
      </g>
    </g>
    
    <!-- 右手拿锅铲 -->
    <g transform="translate(75, 95)">
      <rect x="-5" y="15" width="30" height="12" fill="#ffcc80" transform="rotate(30 -5 15)"/>
      <circle cx="25" cy="25" r="12" fill="#ffcc80"/>
      <!-- 锅铲 -->
      <g transform="translate(30, 5) rotate(-15)">
        <rect x="0" y="0" width="8" height="50" fill="#9e9e9e" rx="3"/>
        <path d="M-10,48 L18,48 L15,68 L-7,68 Z" fill="#78909c"/>
        <ellipse cx="4" cy="58" rx="8" ry="6" fill="#607d8b"/>
      </g>
    </g>
  </g>
  
  <!-- 烹饪锅 -->
  <g transform="translate(300, 380)" filter="url(#shadow2)">
    <!-- 锅身 -->
    <path d="M-70,0 L70,0 L60,55 L-60,55 Z" fill="url(#panGrad)"/>
    <!-- 锅沿 -->
    <ellipse cx="0" cy="0" rx="70" ry="12" fill="#78909c"/>
    <ellipse cx="0" cy="-2" rx="65" ry="10" fill="#546e7a"/>
    <!-- 锅底食物 -->
    <ellipse cx="0" cy="8" rx="55" ry="8" fill="#ff5722" opacity="0.7"/>
    <!-- 锅柄 -->
    <rect x="70" y="-8" width="35" height="16" fill="#37474f" rx="4"/>
    <!-- 蒸汽 -->
    <g opacity="0.6">
      <path d="M-30,-25 Q-25,-45 -30,-65" fill="none" stroke="url(#steam)" stroke-width="4" stroke-linecap="round"/>
      <path d="M0,-30 Q5,-50 0,-70" fill="none" stroke="url(#steam)" stroke-width="5" stroke-linecap="round"/>
      <path d="M30,-25 Q35,-45 30,-65" fill="none" stroke="url(#steam)" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- 周围食材装饰 -->
  <!-- 苹果 -->
  <g transform="translate(80, 350)" filter="url(#shadow2)">
    <circle cx="0" cy="0" r="22" fill="#e53935"/>
    <circle cx="-7" cy="-7" r="6" fill="#ef5350" opacity="0.5"/>
    <path d="M0,-20 L0,-28" stroke="#4caf50" stroke-width="3"/>
    <ellipse cx="8" cy="-24" rx="6" ry="3" fill="#66bb6a" transform="rotate(-30 8 -24)"/>
  </g>
  
  <!-- 柠檬 -->
  <g transform="translate(530, 380)" filter="url(#shadow2)">
    <ellipse cx="0" cy="0" rx="22" ry="16" fill="#fdd835"/>
    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#ffeb3b"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#fbc02d" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#fbc02d" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- 蘑菇 -->
  <g transform="translate(520, 180)" filter="url(#shadow2)">
    <path d="M-18,0 Q0,-25 18,0" fill="#8d6e63"/>
    <rect x="-8" y="0" width="16" height="18" fill="#d7ccc8" rx="4"/>
    <circle cx="-6" cy="-8" r="3" fill="#efebe9"/>
    <circle cx="7" cy="-5" r="2.5" fill="#efebe9"/>
    <circle cx="0" cy="-12" r="2" fill="#efebe9"/>
  </g>
  
  <!-- 鸡蛋 -->
  <g transform="translate(100, 220)" filter="url(#shadow2)">
    <ellipse cx="0" cy="0" rx="18" ry="22" fill="#fff8e1"/>
    <ellipse cx="0" cy="0" rx="14" ry="18" fill="#fffde7"/>
    <ellipse cx="-5" cy="-8" rx="4" ry="5" fill="#ffffff" opacity="0.7"/>
  </g>
  
  <!-- 辣椒 -->
  <g transform="translate(180, 450)" filter="url(#shadow2)">
    <path d="M0,0 Q-8,20 0,35 Q8,20 0,0" fill="#d32f2f"/>
    <path d="M0,-5 L0,-15" stroke="#4caf50" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-3" cy="-12" rx="4" ry="2" fill="#66bb6a" transform="rotate(-20 -3 -12)"/>
  </g>
  
  <!-- 小番茄 -->
  <g transform="translate(450, 450)" filter="url(#shadow2)">
    <circle cx="0" cy="0" r="15" fill="#f44336"/>
    <circle cx="-4" cy="-4" r="4" fill="#ff5252" opacity="0.6"/>
    <path d="M-5,-13 L0,-16 L5,-13" stroke="#4caf50" stroke-width="2"/>
  </g>
  
  <!-- 文字 -->
  <text x="300" y="480" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" fill="#e65100" font-weight="bold">一口一营养，智膳伴日常</text>
</svg>